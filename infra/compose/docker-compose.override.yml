services:
  postgres:
    pull_policy: never
  computer:
    pull_policy: never
  supervisor:
    image: compose-api
    pull_policy: never
    user: "0"
    working_dir: /app/infra/sandboxes/supervisor
    command: [pnpm, start]
  api:
    pull_policy: never
    environment:
      MCP_CONFIG_PATH: /app/mcp.json
    volumes:
      - ../../mcp.json:/app/mcp.json:ro
      - ../../packages/adapters/src/mcp-client.ts:/app/packages/adapters/src/mcp-client.ts:ro
  worker:
    pull_policy: never
    environment:
      MCP_CONFIG_PATH: /app/mcp.json
    volumes:
      - ../../mcp.json:/app/mcp.json:ro
      - ../../packages/adapters/src/mcp-client.ts:/app/packages/adapters/src/mcp-client.ts:ro
  web:
    pull_policy: never
    env_file:
      - ../../.env
